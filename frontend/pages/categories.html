<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý Danh mục - Vintage Vibe Admin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* CSS CHUNG (Đồng bộ với Admin) */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        min-height: 100vh;
        background: #f0f2f5;
      }

      /* SIDEBAR */
      .sidebar {
        width: 260px;
        background: #1a1a1a;
        color: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
        position: fixed;
        height: 100vh;
      }
      .sidebar h2 {
        color: #ff4757;
        margin-bottom: 40px;
        text-align: center;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px;
        color: #aaa;
        text-decoration: none;
        margin-bottom: 5px;
        border-radius: 8px;
        transition: 0.3s;
        cursor: pointer;
      }
      .menu-item:hover,
      .menu-item.active {
        background: #ff4757;
        color: white;
        font-weight: 600;
      }
      .menu-item i {
        width: 20px;
      }

      /* MAIN CONTENT */
      .main {
        flex: 1;
        padding: 30px;
        margin-left: 260px;
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .page-title {
        font-size: 24px;
        font-weight: 800;
        color: #333;
      }

      /* FORM & TABLE */
      .content-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
      }
      .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }
      .btn-save {
        width: 100%;
        padding: 10px;
        background: #2ecc71;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-save:hover {
        background: #27ae60;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }
      th {
        background: #f8f9fa;
        color: #555;
        font-weight: 600;
      }

      .btn-action {
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        color: white;
        margin-right: 5px;
      }
      .btn-edit {
        background: #f39c12;
      }
      .btn-delete {
        background: #e74c3c;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>ADMIN VIBE</h2>
      <a href="admin.html" class="menu-item"
        ><i class="fa-solid fa-chart-line"></i> Dashboard</a
      >
      <a href="admin.html" class="menu-item"
        ><i class="fa-solid fa-box"></i> Sản phẩm</a
      >
      <a href="categories.html" class="menu-item active"
        ><i class="fa-solid fa-layer-group"></i> Danh mục</a
      >
      <a href="admin.html" class="menu-item"
        ><i class="fa-solid fa-cart-shopping"></i> Đơn hàng</a
      >
      <a href="index.html" class="menu-item" style="margin-top: auto"
        ><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a
      >
    </div>

    <div class="main">
      <div class="header-row">
        <h1 class="page-title">Quản lý Loại sản phẩm</h1>
      </div>

      <div class="content-grid">
        <div class="card">
          <h3 style="margin-bottom: 20px; color: #333">Thêm mới</h3>
          <form id="categoryForm">
            <input type="hidden" id="catId" />
            <div class="form-group">
              <label class="form-label">Tên danh mục</label>
              <input
                type="text"
                id="catName"
                class="form-control"
                placeholder="Ví dụ: Áo Hoodie"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Mã danh mục (Viết liền, không dấu)</label
              >
              <input
                type="text"
                id="catCode"
                class="form-control"
                placeholder="Ví dụ: hoodie"
                required
              />
            </div>
            <button type="submit" class="btn-save">Lưu danh mục</button>
            <button
              type="button"
              onclick="resetForm()"
              style="
                width: 100%;
                margin-top: 10px;
                padding: 10px;
                border: none;
                background: #eee;
                cursor: pointer;
                border-radius: 6px;
              "
            >
              Hủy
            </button>
          </form>
        </div>

        <div class="card">
          <h3 style="margin-bottom: 20px; color: #333">Danh sách hiện có</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Tên danh mục</th>
                <th>Mã (Code)</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="categoryList"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // DATA MẪU BAN ĐẦU
      const DEFAULT_CATS = [
        { id: 1, name: "Sản phẩm mới", code: "new" },
        { id: 2, name: "Flash Sale", code: "sale" },
        { id: 3, name: "Bán chạy nhất", code: "best" },
        { id: 4, name: "Áo Hoodie", code: "hoodie" },
        { id: 5, name: "Quần Jeans", code: "jeans" },
      ];

      // 1. Tải danh sách
      function loadCategories() {
        let cats = JSON.parse(localStorage.getItem("categories"));
        // Nếu chưa có thì nạp mẫu
        if (!cats || cats.length === 0) {
          cats = DEFAULT_CATS;
          localStorage.setItem("categories", JSON.stringify(cats));
        }

        const tbody = document.getElementById("categoryList");
        tbody.innerHTML = cats
          .map(
            (c) => `
                <tr>
                    <td>#${c.id}</td>
                    <td><b>${c.name}</b></td>
                    <td><span style="background:#eee; padding:2px 6px; border-radius:4px; font-size:12px;">${c.code}</span></td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editCat(${c.id})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-action btn-delete" onclick="deleteCat(${c.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `
          )
          .join("");
      }

      // 2. Thêm hoặc Sửa
      document
        .getElementById("categoryForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const id = document.getElementById("catId").value;
          const name = document.getElementById("catName").value;
          const code = document.getElementById("catCode").value;

          let cats = JSON.parse(localStorage.getItem("categories")) || [];

          if (id) {
            // Sửa
            const index = cats.findIndex((c) => c.id == id);
            if (index !== -1) cats[index] = { id: Number(id), name, code };
          } else {
            // Thêm mới
            // Kiểm tra trùng code
            if (cats.some((c) => c.code === code)) {
              alert("Mã danh mục này đã tồn tại!");
              return;
            }
            cats.push({ id: Date.now(), name, code });
          }

          localStorage.setItem("categories", JSON.stringify(cats));
          resetForm();
          loadCategories();
          alert("Lưu thành công!");
        });

      // 3. Xóa
      function deleteCat(id) {
        if (confirm("Bạn chắc chắn muốn xóa danh mục này?")) {
          let cats = JSON.parse(localStorage.getItem("categories")) || [];
          cats = cats.filter((c) => c.id !== id);
          localStorage.setItem("categories", JSON.stringify(cats));
          loadCategories();
        }
      }

      // 4. Đưa dữ liệu lên form để sửa
      function editCat(id) {
        let cats = JSON.parse(localStorage.getItem("categories")) || [];
        const cat = cats.find((c) => c.id === id);
        if (cat) {
          document.getElementById("catId").value = cat.id;
          document.getElementById("catName").value = cat.name;
          document.getElementById("catCode").value = cat.code;
        }
      }

      function resetForm() {
        document.getElementById("categoryForm").reset();
        document.getElementById("catId").value = "";
      }

      loadCategories();
    </script>
  </body>
</html>
