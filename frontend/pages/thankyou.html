<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt hàng thành công - Vintage Vibe</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .thank-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 500px;
      }
      .icon-box {
        width: 80px;
        height: 80px;
        background: #2ecc71;
        color: white;
        border-radius: 50%;
        font-size: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }
      h2 {
        color: #2f3542;
        margin-bottom: 10px;
      }
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
      }
      .highlight {
        color: #e74c3c;
        font-weight: bold;
      }
      .btn-home {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 30px;
        background: #2f3542;
        color: white;
        text-decoration: none;
        border-radius: 50px;
        transition: 0.3s;
      }
      .btn-home:hover {
        background: #ff4757;
      }
    </style>
  </head>
  <body>
    <div class="thank-card">
      <div class="icon-box"><i class="fa-solid fa-check"></i></div>
      <h2>ĐẶT HÀNG THÀNH CÔNG!</h2>

      <p>Cảm ơn bạn đã mua sắm tại <b>Vintage Vibe</b>.</p>
      <p>Đơn hàng của bạn đã được ghi nhận vào hệ thống.</p>

      <p
        style="
          background: #fff3cd;
          color: #856404;
          padding: 10px;
          border-radius: 5px;
          margin-top: 15px;
        "
      >
        <i class="fa-solid fa-clock"></i>
        Vui lòng chờ <b>Admin</b> duyệt đơn hàng để tiến hành giao hàng nhé!
      </p>

      <a href="index.html" class="btn-home">Tiếp tục mua sắm</a>
    </div>
  </body>
</html>
