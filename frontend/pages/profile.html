<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Hồ sơ của tôi - Vintage Vibe</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* CSS CHUNG */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: #f8f9fa;
        padding-top: 80px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* HEADER */
      .header {
        background: #000;
        padding: 15px 0;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
      }
      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo a {
        color: #ff4757;
        font-size: 24px;
        font-weight: 900;
        text-decoration: none;
        text-transform: uppercase;
      }
      .menu-link {
        color: #fff;
        text-decoration: none;
        margin-left: 20px;
        font-size: 14px;
      }
      .cart-btn {
        color: white;
        text-decoration: none;
        font-size: 24px;
        position: relative;
      }
      .cart-count {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #ff4757;
        font-size: 11px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* LAYOUT PROFILE */
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
      }

      /* Cột trái: Menu User */
      .user-sidebar {
        flex: 1;
        min-width: 250px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        height: fit-content;
      }
      .user-avatar {
        width: 80px;
        height: 80px;
        background: #eee;
        border-radius: 50%;
        margin: 0 auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        color: #aaa;
      }
      .user-name {
        text-align: center;
        font-weight: bold;
        font-size: 18px;
        color: #333;
        margin-bottom: 5px;
      }
      .user-role {
        text-align: center;
        color: #888;
        font-size: 13px;
        margin-bottom: 20px;
      }

      .user-menu-item {
        display: block;
        padding: 12px;
        color: #555;
        text-decoration: none;
        border-radius: 6px;
        transition: 0.2s;
        font-weight: 600;
      }
      .user-menu-item:hover,
      .user-menu-item.active {
        background: #f0f2f5;
        color: #ff4757;
      }
      .user-menu-item i {
        width: 25px;
      }

      .btn-logout {
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #e74c3c;
        color: #e74c3c;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-logout:hover {
        background: #e74c3c;
        color: white;
      }

      /* Cột phải: Nội dung */
      .user-content {
        flex: 3;
        min-width: 300px;
      }
      .content-card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
      .section-title {
        font-size: 20px;
        font-weight: 800;
        color: #333;
        margin-bottom: 20px;
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 10px;
      }

      /* Danh sách đơn hàng */
      .order-item {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px dashed #eee;
        padding-bottom: 10px;
      }
      .order-id {
        font-weight: bold;
        color: #333;
      }
      .order-date {
        color: #888;
        font-size: 13px;
      }

      /* Badge trạng thái */
      .status-badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }
      .st-pending {
        background: #fff3cd;
        color: #856404;
      }
      .st-shipping {
        background: #cce5ff;
        color: #004085;
      }
      .st-success {
        background: #d4edda;
        color: #155724;
      }
      .st-cancel {
        background: #f8d7da;
        color: #721c24;
      }

      .order-products {
        margin-bottom: 15px;
      }
      .op-item {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
      }
      .op-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #eee;
      }
      .op-info {
        flex: 1;
      }
      .op-name {
        font-weight: 600;
        font-size: 14px;
        color: #333;
      }
      .op-price {
        font-size: 13px;
        color: #ff4757;
      }

      .order-total {
        text-align: right;
        font-size: 16px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="logo"><a href="index.html">VINTAGE VIBE</a></div>
        <div style="display: flex; align-items: center">
          <a href="index.html" class="menu-link">Trang chủ</a>
          <a
            href="cart.html"
            class="menu-link cart-btn"
            style="margin-left: 30px"
          >
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="user-sidebar">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-name" id="profileName">Loading...</div>
        <div class="user-role">Thành viên thân thiết</div>

        <a href="#" class="user-menu-item active"
          ><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đơn hàng</a
        >
        <a href="#" class="user-menu-item"
          ><i class="fa-solid fa-user-gear"></i> Thông tin tài khoản</a
        >
        <a href="#" class="user-menu-item"
          ><i class="fa-solid fa-key"></i> Đổi mật khẩu</a
        >

        <button class="btn-logout" onclick="logout()">Đăng xuất</button>
      </div>

      <div class="user-content">
        <div class="content-card">
          <h2 class="section-title">Lịch sử mua hàng</h2>
          <div id="orderHistoryList">
            <p style="text-align: center; color: #999">Đang tải dữ liệu...</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 1. Check đăng nhập
      const currentUser = JSON.parse(localStorage.getItem("currentUser"));
      if (!currentUser) {
        alert("Vui lòng đăng nhập để xem hồ sơ!");
        window.location.href = "login.html";
      } else {
        document.getElementById("profileName").innerText =
          currentUser.fullname || currentUser.username;
      }

      const formatCurrency = (amount) =>
        new Intl.NumberFormat("vi-VN", {
          style: "currency",
          currency: "VND",
        }).format(amount);

      // 2. Load Lịch sử đơn hàng
      function loadOrderHistory() {
        const orders = JSON.parse(localStorage.getItem("orders")) || [];
        const container = document.getElementById("orderHistoryList");

        // Lọc đơn hàng của user hiện tại
        // So sánh Tên người nhận trong đơn hàng VỚI Tên đầy đủ của tài khoản
        // (Lưu ý: Để test mượt, bạn nhớ nhập tên lúc Thanh toán giống tên Đăng ký nhé)
        const myOrders = orders.filter(
          (o) =>
            o.customer.name
              .toLowerCase()
              .includes(currentUser.fullname.toLowerCase()) ||
            currentUser.username === "admin" // Admin thấy hết để test
        );

        if (myOrders.length === 0) {
          container.innerHTML = `
                    <div style="text-align:center; padding: 30px;">
                        <img src="https://cdn-icons-png.flaticon.com/512/4076/4076432.png" width="80" style="opacity:0.5; margin-bottom:15px">
                        <p>Bạn chưa có đơn hàng nào.</p>
                        <a href="index.html" style="color:#ff4757; font-weight:bold">Đi mua sắm ngay</a>
                    </div>
                `;
          return;
        }

        container.innerHTML = myOrders
          .map((order) => {
            // Xác định màu trạng thái
            let stClass = "st-pending";
            if (order.status === "Đang giao") stClass = "st-shipping";
            if (order.status === "Hoàn thành") stClass = "st-success";
            if (order.status === "Đã hủy") stClass = "st-cancel";

            // List sản phẩm con
            const productsHtml = order.items
              .map(
                (p) => `
                    <div class="op-item">
                        <img src="${
                          p.image
                        }" class="op-img" onerror="this.src='https://via.placeholder.com/60'">
                        <div class="op-info">
                            <div class="op-name">${p.name}</div>
                            <div class="op-price">${formatCurrency(
                              p.price
                            )} x ${p.qty}</div>
                        </div>
                    </div>
                `
              )
              .join("");

            return `
                    <div class="order-item">
                        <div class="order-header">
                            <div>
                                <span class="order-id">#${order.id}</span>
                                <span class="order-date"> - ${order.date}</span>
                            </div>
                            <span class="status-badge ${stClass}">${
              order.status
            }</span>
                        </div>
                        <div class="order-products">
                            ${productsHtml}
                        </div>
                        <div class="order-total">
                            Tổng tiền: <span style="color:#ff4757">${formatCurrency(
                              order.total
                            )}</span>
                        </div>
                    </div>
                `;
          })
          .join("");
      }

      // 3. Đăng xuất
      function logout() {
        if (confirm("Đăng xuất khỏi tài khoản?")) {
          localStorage.removeItem("currentUser");
          window.location.href = "index.html";
        }
      }

      // 4. Cart Count
      function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.reduce(
          (s, i) => s + i.qty,
          0
        );
      }

      loadOrderHistory();
      updateCartCount();
    </script>
  </body>
</html>
