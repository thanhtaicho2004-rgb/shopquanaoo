<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu - Vintage Vibe</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* CSS DÙNG CHUNG FORM LOGIN */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: #f0f2f5;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: linear-gradient(135deg, #1e272e 0%, #111 100%);
      }
      .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .brand {
        color: #ff4757;
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: block;
        text-decoration: none;
      }
      .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      .btn-submit {
        width: 100%;
        padding: 12px;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-submit:hover {
        background: #ff2e40;
      }
      .back-link {
        margin-top: 20px;
        display: block;
        color: #555;
        text-decoration: none;
        font-size: 14px;
      }
      .back-link:hover {
        color: #ff4757;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <a href="index.html" class="brand">Vintage Vibe</a>
      <h3 style="margin-bottom: 10px">Khôi phục mật khẩu</h3>
      <p style="color: #666; font-size: 14px; margin-bottom: 25px">
        Nhập email hoặc tên đăng nhập của bạn để nhận mật khẩu mới.
      </p>

      <form id="forgotForm">
        <input
          type="text"
          id="email"
          class="form-control"
          placeholder="Email hoặc Tên đăng nhập"
          required
        />
        <button type="submit" class="btn-submit">GỬI YÊU CẦU</button>
      </form>

      <a href="login.html" class="back-link"
        ><i class="fa-solid fa-arrow-left"></i> Quay lại Đăng nhập</a
      >
    </div>

    <script>
      document
        .getElementById("forgotForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("email").value;

          // Giả lập gửi mail (Vì không có Backend thật)
          // Hiệu ứng chờ 1 chút cho giống thật
          const btn = document.querySelector(".btn-submit");
          btn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
          btn.disabled = true;

          setTimeout(() => {
            alert(
              `Một email chứa mật khẩu mới đã được gửi tới "${email}".\nVui lòng kiểm tra hộp thư (cả mục Spam)!`
            );
            window.location.href = "login.html";
          }, 1500);
        });
    </script>
  </body>
</html>
